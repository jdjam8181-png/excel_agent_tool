[package]
name = "stop_tool"
version = "0.1.0"
edition = "2024"


[dependencies]

anyhow = "1"

clap = {
    version = "4.5",
    features = [
        "derive"
    ]
}

chrono = "0.4"

log = "0.4"

env_logger = "0.11"

serde = {
    version = "1",
    features = [
        "derive"
    ]
}

serde_json = "1"

rayon = "1"

ssh_pub = {
    path = "../ssh_pub"
}


